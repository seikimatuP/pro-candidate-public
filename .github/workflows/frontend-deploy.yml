name: Frontend Deploy (Optimized)

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      aws-region: ${{ steps.env.outputs.aws-region }}

    steps:
      - name: Determine deployment environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
          echo "aws-region=ap-northeast-1" >> $GITHUB_OUTPUT

  frontend-deploy:
    name: Deploy Frontend (${{ needs.determine-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: determine-environment
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.determine-environment.outputs.aws-region }}

      - name: Get AWS resources info
        id: aws-info
        run: |
          ENV="${{ needs.determine-environment.outputs.environment }}"
          STACK_NAME="ProBaseballStack-${ENV}"

          echo "📡 Getting AWS resources info for ${ENV} environment..."

          # CloudFormationスタックから情報取得
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
            --output text 2>/dev/null || echo "")

          COGNITO_USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`CognitoUserPoolId`].OutputValue' \
            --output text 2>/dev/null || echo "")

          COGNITO_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`CognitoClientId`].OutputValue' \
            --output text 2>/dev/null || echo "")

          FRONTEND_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`SimpleFrontendConstructFrontendBucketName0F607CA8`].OutputValue' \
            --output text 2>/dev/null || echo "pro-candidate-frontend-${ENV}")

          CLOUDFRONT_URL=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query 'Stacks[0].Outputs[?contains(OutputKey, `CloudFrontDistributionUrl`)].OutputValue' \
            --output text 2>/dev/null || echo "")

          echo "API_URL=${API_URL}" >> $GITHUB_OUTPUT
          echo "COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}" >> $GITHUB_OUTPUT
          echo "COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}" >> $GITHUB_OUTPUT
          echo "FRONTEND_BUCKET=${FRONTEND_BUCKET}" >> $GITHUB_OUTPUT
          echo "CLOUDFRONT_URL=${CLOUDFRONT_URL}" >> $GITHUB_OUTPUT

          echo "✅ Retrieved AWS resources:"
          echo "  API URL: ${API_URL}"
          echo "  Cognito Pool: ${COGNITO_USER_POOL_ID}"
          echo "  Frontend Bucket: ${FRONTEND_BUCKET}"
          echo "  CloudFront URL: ${CLOUDFRONT_URL}"

          # 必須値の検証
          if [ -z "$API_URL" ]; then
            echo "❌ ERROR: API_URL is empty. Infrastructure may not be deployed."
            exit 1
          fi

          if [ -z "$FRONTEND_BUCKET" ]; then
            echo "❌ ERROR: FRONTEND_BUCKET is empty. Infrastructure may not be deployed."
            exit 1
          fi

      - name: 🔍 Pre-Frontend Lambda Environment Check
        run: |
          echo "🔍 Verifying backend Lambda environment before frontend deployment..."

          # Make verification script executable
          chmod +x scripts/verify-lambda-environment.sh

          # Run environment verification for backend
          echo "Checking backend Lambda environment for ${{ needs.determine-environment.outputs.environment }}..."
          if scripts/verify-lambda-environment.sh ${{ needs.determine-environment.outputs.environment }}; then
            echo "✅ Backend environment variables OK - proceeding with frontend deployment"
          else
            VERIFICATION_EXIT_CODE=$?
            if [ $VERIFICATION_EXIT_CODE -eq 2 ]; then
              echo "🚨 CRITICAL: Backend environment variables missing!"
              echo "Frontend deployment would fail due to backend issues!"
              exit 1
            else
              echo "⚠️ Backend has some environment variable issues"
              echo "Frontend deployment may experience API connectivity issues"
              echo "Continuing with deployment but please monitor closely"
            fi
          fi

      - name: Build Frontend
        run: |
          cd frontend
          echo "📦 Installing frontend dependencies..."
          npm ci

          echo "🔧 Setting up environment variables..."
          ENV="${{ needs.determine-environment.outputs.environment }}"

          # API URLを動的に更新（CloudFormationから取得した値で直接環境変数ファイルを更新）
          if [ -n "${{ steps.aws-info.outputs.API_URL }}" ]; then
            if [ "$ENV" = "prod" ]; then
              echo "🔄 Updating API URL in .env.prod to: ${{ steps.aws-info.outputs.API_URL }}"
              sed -i "s|^VITE_API_BASE_URL=.*|VITE_API_BASE_URL=${{ steps.aws-info.outputs.API_URL }}|" .env.prod
              echo "📋 Using .env.prod for production environment"
              cat .env.prod | grep -E "^VITE_" | sed 's/=.*/=***/' # セキュリティのため値は隠す
            elif [ "$ENV" = "dev" ]; then
              echo "🔄 Updating API URL in .env.dev to: ${{ steps.aws-info.outputs.API_URL }}"
              sed -i "s|^VITE_API_BASE_URL=.*|VITE_API_BASE_URL=${{ steps.aws-info.outputs.API_URL }}|" .env.dev
              echo "📋 Using .env.dev for development environment"
              cat .env.dev | grep -E "^VITE_" | sed 's/=.*/=***/' # セキュリティのため値は隠す
            fi
          fi

          echo "🔨 Building frontend with environment: $ENV"
          if [ "$ENV" = "prod" ]; then
            npm run build:prod
          elif [ "$ENV" = "dev" ]; then
            npm run build:dev
          else
            echo "⚠️ Unknown environment: $ENV, using default build"
            npm run build
          fi

          echo "✅ Frontend build completed!"
          ls -la dist/

      - name: Deploy to S3
        run: |
          cd frontend
          BUCKET_NAME="${{ steps.aws-info.outputs.FRONTEND_BUCKET }}"

          echo "🚀 Deploying frontend to S3 bucket: ${BUCKET_NAME}"

          # S3バケットの存在確認
          if aws s3 ls "s3://${BUCKET_NAME}" > /dev/null 2>&1; then
            echo "✅ S3 bucket exists: ${BUCKET_NAME}"
            
            # SPA用Website設定の確認・設定
            echo "🔧 Checking S3 Website configuration for SPA support..."
            
            # 現在のWebsite設定を確認
            CURRENT_CONFIG=$(aws s3api get-bucket-website --bucket "${BUCKET_NAME}" 2>/dev/null || echo "NONE")
            
            if echo "$CURRENT_CONFIG" | grep -q "ErrorDocument.*index.html"; then
              echo "✅ Website configuration already correct for SPA"
            else
              echo "⚠️ Website configuration missing or incorrect - setting up SPA support"
              
              # Website設定を適用（SPA用: ErrorDocumentもindex.htmlに設定）
              aws s3api put-bucket-website --bucket "${BUCKET_NAME}" \
                --website-configuration '{
                  "IndexDocument": {"Suffix": "index.html"},
                  "ErrorDocument": {"Key": "index.html"}
                }'
              
              echo "✅ Website configuration updated for SPA support"
              
              # 設定確認
              aws s3api get-bucket-website --bucket "${BUCKET_NAME}"
            fi
            
            # syncコマンドで安全にデプロイ（削除と追加を同時に実行）
            echo "🔄 Syncing files to S3..."
            
            # 静的アセット（画像、CSS等）は長いキャッシュ
            aws s3 sync dist/ "s3://${BUCKET_NAME}" \
              --delete \
              --cache-control "public, max-age=31536000" \
              --exclude "*.html" \
              --exclude "*.js"
            
            # HTMLとJSファイルは短いキャッシュ
            aws s3 sync dist/ "s3://${BUCKET_NAME}" \
              --delete \
              --cache-control "public, max-age=300" \
              --exclude "*" \
              --include "*.html" \
              --include "*.js"
              
            echo "✅ Frontend deployment completed!"
          else
            echo "❌ S3 bucket not found: ${BUCKET_NAME}"
            echo "Please ensure AWS infrastructure is deployed first."
            exit 1
          fi

      - name: Get Frontend URL and Health Check
        run: |
          BUCKET_NAME="${{ steps.aws-info.outputs.FRONTEND_BUCKET }}"
          ENV="${{ needs.determine-environment.outputs.environment }}"

          # S3 Website URLを構築
          FRONTEND_URL="http://${BUCKET_NAME}.s3-website-${{ needs.determine-environment.outputs.aws-region }}.amazonaws.com"

          echo "🌐 Frontend URL: ${FRONTEND_URL}"
          echo "FRONTEND_URL=${FRONTEND_URL}" >> $GITHUB_ENV

          # 簡易ヘルスチェック
          echo "🏥 Performing health check..."
          sleep 10

          if curl -f "${FRONTEND_URL}" -o /dev/null -s -w "%{http_code}\n"; then
            echo "✅ Frontend is accessible!"
          else
            echo "⚠️ Frontend health check failed (may take a few minutes to propagate)"
          fi

      # アーティファクトアップロードを一時的に無効化
      # ストレージクォータ問題が解決するまでコメントアウト
      # - name: Upload artifacts
      #   uses: actions/upload-artifact@v4
      #   if: failure() # 失敗時のみアップロード
      #   with:
      #     name: frontend-build-${{ needs.determine-environment.outputs.environment }}
      #     path: frontend/dist/
      #     retention-days: 1
      #     compression-level: 9

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Frontend deployment to ${{ needs.determine-environment.outputs.environment }} completed successfully!"
          echo "🌐 Frontend URL: ${{ env.FRONTEND_URL }}"
          echo "⏰ Build time: $(date)"
