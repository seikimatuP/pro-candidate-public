name: Dependency Security Check

on:
  schedule:
    # 毎週月曜日 午前9時（JST）に実行
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd pro-candidate-aws && npm ci

      - name: Run npm audit (Root)
        run: |
          echo "🔍 Root package audit..."
          npm audit --audit-level=high --json > root-audit.json || true
          npm audit --audit-level=high || echo "⚠️ Vulnerabilities found in root dependencies"

      - name: Run npm audit (AWS CDK)
        run: |
          echo "🔍 AWS CDK package audit..."
          cd pro-candidate-aws
          npm audit --audit-level=high --json > cdk-audit.json || true
          npm audit --audit-level=high || echo "⚠️ Vulnerabilities found in CDK dependencies"

      - name: Check for outdated packages
        run: |
          echo "📦 Checking outdated packages..."
          npm outdated --json > root-outdated.json || true
          cd pro-candidate-aws && npm outdated --json > cdk-outdated.json || true

      - name: Generate security report
        run: |
          echo "📋 Generating security report..."
          cat > security-report.md << 'EOF'
          # Dependency Security Report

          Generated on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ## Root Package Vulnerabilities
          $(if [ -s root-audit.json ]; then echo "Found vulnerabilities - check root-audit.json"; else echo "✅ No high/critical vulnerabilities found"; fi)

          ## AWS CDK Package Vulnerabilities  
          $(if [ -s pro-candidate-aws/cdk-audit.json ]; then echo "Found vulnerabilities - check cdk-audit.json"; else echo "✅ No high/critical vulnerabilities found"; fi)

          ## Outdated Packages
          $(if [ -s root-outdated.json ]; then echo "📦 Root packages have updates available"; else echo "✅ Root packages are up to date"; fi)
          $(if [ -s pro-candidate-aws/cdk-outdated.json ]; then echo "📦 CDK packages have updates available"; else echo "✅ CDK packages are up to date"; fi)

          ## Recommendations
          - Review and update dependencies regularly
          - Test thoroughly after updates
          - Check AWS CDK compatibility before upgrading
          EOF

      # アーティファクトアップロードを一時的に無効化
      # ストレージクォータ問題が解決するまでコメントアウト
      # - name: Upload security artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: security-audit-report
      #     path: |
      #       root-audit.json
      #       pro-candidate-aws/cdk-audit.json
      #       root-outdated.json
      #       pro-candidate-aws/cdk-outdated.json
      #       security-report.md
      #     retention-days: 7
      #     compression-level: 9

      - name: Create issue on critical vulnerabilities
        uses: actions/github-script@v8
        if: always()
        with:
          script: |
            const fs = require('fs');

            // セキュリティレポートの読み込み
            let hasCriticalVulns = false;

            try {
              const rootAudit = fs.readFileSync('root-audit.json', 'utf8');
              if (rootAudit.includes('"severity":"critical"')) {
                hasCriticalVulns = true;
              }
            } catch (e) {}

            try {
              const cdkAudit = fs.readFileSync('pro-candidate-aws/cdk-audit.json', 'utf8');
              if (cdkAudit.includes('"severity":"critical"')) {
                hasCriticalVulns = true;
              }
            } catch (e) {}

            if (hasCriticalVulns) {
              // クリティカルな脆弱性が見つかった場合、Issueを作成
              const issueBody = `
              # 🚨 Critical Security Vulnerabilities Detected
              
              The automated dependency audit has detected critical security vulnerabilities.
              
              ## Action Required
              - [ ] Review the security audit report
              - [ ] Update vulnerable dependencies
              - [ ] Test the application after updates
              - [ ] Deploy security fixes
              
              ## Artifacts
              Check the [security audit artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for detailed information.
              
              **Auto-generated by dependency-check workflow**
              `;
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Critical Security Vulnerabilities Detected',
                body: issueBody,
                labels: ['security', 'dependencies', 'critical']
              });
            }
