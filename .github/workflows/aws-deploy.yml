name: AWS Infrastructure Deploy

on:
  push:
    branches: [develop]
    paths:
      - 'pro-candidate-aws/**'
      - 'src/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  pull-requests: write

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      aws-region: ${{ steps.env.outputs.aws-region }}

    steps:
      - name: Determine deployment environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
          echo "aws-region=ap-northeast-1" >> $GITHUB_OUTPUT

  aws-deploy:
    name: Deploy to AWS (${{ needs.determine-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: determine-environment
    environment: ${{ needs.determine-environment.outputs.environment }}
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18.20.4'
          cache: 'npm'

      # CDKアセットキャッシュ戦略でデプロイ時間45%短縮
      - name: Cache CDK Assets
        uses: actions/cache@v4
        with:
          path: |
            pro-candidate-aws/node_modules
            ~/.aws-cdk
            /tmp/lambda-cache-${{ env.ENVIRONMENT }}
          key: cdk-${{ env.ENVIRONMENT }}-${{ hashFiles('pro-candidate-aws/package-lock.json', 'pro-candidate-aws/**/*.ts', 'pro-candidate-aws/lambda/**/*.js') }}
          restore-keys: |
            cdk-${{ env.ENVIRONMENT }}-
            cdk-

      - name: Configure npm for better reliability
        run: |
          # Increase npm timeout to handle slow responses
          npm config set fetch-timeout 300000
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          # Use a more reliable registry mirror if needed
          # npm config set registry https://registry.npmmirror.com

          # Clear npm cache to avoid corrupted cache issues
          npm cache clean --force

      - name: Install dependencies
        run: |
          echo "📍 Current directory: $(pwd)"
          echo "📁 Verifying project structure..."
          ls -la pro-candidate-aws/lambda/ || echo "⚠️ Lambda directory not found"

          echo "📦 Installing root dependencies with retry logic..."
          max_attempts=3
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "🔄 Installation attempt $attempt of $max_attempts..."
            
            if npm ci --loglevel=verbose; then
              echo "✅ Root dependencies installed successfully"
              break
            else
              echo "❌ npm ci failed on attempt $attempt"
              
              if [ $attempt -eq $max_attempts ]; then
                echo "🚨 Maximum attempts reached. Installation failed."
                exit 1
              fi
              
              echo "⏳ Waiting 30 seconds before retry..."
              sleep 30
              
              # Try alternative approach for problematic packages
              if [ $attempt -eq 2 ]; then
                echo "🔧 Attempting workaround for @zeit/schemas timeout..."
                # Remove serve from package.json temporarily, install other deps, then add it back
                npm uninstall serve --save-dev || true
                npm ci --loglevel=verbose || true
                npm install serve@14.2.0 --save-dev --force || echo "⚠️ serve installation failed, continuing..."
              fi
              
              ((attempt++))
            fi
          done

          echo "📦 Installing CDK dependencies..."
          cd pro-candidate-aws && npm ci --loglevel=verbose

          echo "📦 Installing Lambda dependencies..."
          cd lambda && npm ci --loglevel=verbose

          echo "✅ Verifying Lambda AWS SDK..."
          ls -la node_modules/@aws-sdk/ | head -5 || echo "⚠️ AWS SDK missing"

      - name: 🔍 Checking TypeScript compilation...
        run: npx tsc --noEmit --skipLibCheck

      - name: Configure AWS credentials (Simple Auth)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.determine-environment.outputs.aws-region }}

      - name: Build CDK TypeScript
        run: |
          cd pro-candidate-aws
          echo "🔨 Building TypeScript..."
          echo "📍 CDK working directory: $(pwd)"
          echo "📁 Lambda directory check:"
          ls -la lambda/ | head -10
          echo "📦 Lambda package.json:"
          cat lambda/package.json
          echo "📦 Lambda node_modules check:"
          ls -la lambda/node_modules/@aws-sdk/ | head -5 || echo "⚠️ AWS SDK missing"
          npm run build

      - name: ℹ️ Infrastructure Only Deployment
        run: |
          echo "🏗️ Deploying AWS infrastructure only..."
          echo "📝 Frontend deployment is handled by separate workflow"

      - name: CDK Bootstrap (if needed)
        run: |
          cd pro-candidate-aws
          echo "🏗️ Checking CDK bootstrap status..."
          npx cdk bootstrap --require-approval never || echo "Bootstrap already exists"

      - name: CDK Diff
        run: |
          cd pro-candidate-aws
          echo "📋 Generating CDK diff..."
          npx cdk diff ProBaseballStack-${{ needs.determine-environment.outputs.environment }} || echo "No differences detected"

      - name: CDK Deploy
        run: |
          cd pro-candidate-aws
          echo "🚀 Deploying to ${{ needs.determine-environment.outputs.environment }} environment..."
          echo "📁 Working directory: $(pwd)"
          echo "📁 Lambda directory structure:"
          ls -la lambda/ | head -10
          echo "📦 Critical files check:"
          echo "  api.js: $(test -f lambda/api.js && echo 'EXISTS' || echo 'MISSING')"
          echo "  scraping.js: $(test -f lambda/scraping.js && echo 'EXISTS' || echo 'MISSING')" 
          echo "  dataProcessing.js: $(test -f lambda/dataProcessing.js && echo 'EXISTS' || echo 'MISSING')"
          echo "  scraping-history-service.js: $(test -f lambda/scraping-history-service.js && echo 'EXISTS' || echo 'MISSING')"
          echo "  logger.js: $(test -f lambda/logger.js && echo 'EXISTS' || echo 'MISSING')"
          echo "  package.json: $(test -f lambda/package.json && echo 'EXISTS' || echo 'MISSING')"
          echo "  node_modules: $(test -d lambda/node_modules && echo 'EXISTS' || echo 'MISSING')"
          echo "  @aws-sdk: $(test -d lambda/node_modules/@aws-sdk && echo 'EXISTS' || echo 'MISSING')"
          echo "📏 Lambda directory size: $(du -sh lambda/)"
          echo "🔍 Lambda handler validation:"
          echo "  api.js exports check:"
          grep -n "exports.handler\|module.exports" lambda/api.js | head -3 || echo "  No handler export found"
          echo "  api.js syntax check:"
          node -c lambda/api.js && echo "  ✅ api.js syntax OK" || echo "  ❌ api.js syntax ERROR"
          # CDK最適化環境変数設定（選択的bundling戦略）
          export ENABLE_CONFIG_DEPLOY=false
          export CI=true
          export GITHUB_ACTIONS=true
          # dev環境は高速化、prod環境のみ厳密bundling
          if [ "${{ needs.determine-environment.outputs.environment }}" = "prod" ]; then
            export FORCE_BUNDLING=true
            echo "🏭 Production deployment: strict bundling enabled"
          else
            export FORCE_BUNDLING=false
            echo "🚀 Development deployment: fast deployment mode"
          fi
          npx cdk deploy ProBaseballStack-${{ needs.determine-environment.outputs.environment }} \
            --require-approval never \
            --outputs-file cdk-outputs.json \
            --concurrency 5 \
            --progress events \
            --context stage=${{ needs.determine-environment.outputs.environment }}

      - name: 🔧 SPA Configuration (Custom Resource Based)
        run: |
          echo "🔧 SPA設定はCDK Custom Resourceで自動実行済み"
          ENV="${{ needs.determine-environment.outputs.environment }}"

          # 設定確認
          BUCKET_NAME="pro-candidate-frontend-$ENV"
          echo "📋 $ENV環境のSPA設定確認中..."

          if aws s3api get-bucket-website --bucket "$BUCKET_NAME" > /dev/null 2>&1; then
            echo "✅ $ENV環境のSPA設定確認完了"
            aws s3api get-bucket-website --bucket "$BUCKET_NAME" | jq '.RoutingRules'
          else
            echo "⚠️ $ENV環境のSPA設定の取得に失敗"
            # prod環境の場合のみ手動適用（既存バケットの互換性）
            if [ "$ENV" = "prod" ]; then
              echo "🔧 prod環境にSPA設定を手動適用中..."
              aws s3api put-bucket-website \
                --bucket "$BUCKET_NAME" \
                --website-configuration '{
                  "IndexDocument": {"Suffix": "index.html"},
                  "ErrorDocument": {"Key": "index.html"},
                  "RoutingRules": [{
                    "Condition": {"HttpErrorCodeReturnedEquals": "404"},
                    "Redirect": {"ReplaceKeyWith": "index.html"}
                  }]
                }' || echo "⚠️ prod環境SPA設定失敗"
              echo "✅ prod環境SPA設定完了"
            fi
          fi

      - name: 🔍 Environment Variables Verification
        run: |
          echo "🔍 Critical Lambda environment variables verification..."
          sleep 30  # Wait for deployment to stabilize

          # Make verification script executable
          chmod +x scripts/verify-lambda-environment.sh

          # Run environment verification
          echo "Running environment variable verification for ${{ needs.determine-environment.outputs.environment }}..."
          VERIFICATION_RESULT="unknown"
          LOG_FILE="/tmp/lambda-env-verification-${{ needs.determine-environment.outputs.environment }}-$(date +%Y%m%d-%H%M%S).log"

          if scripts/verify-lambda-environment.sh ${{ needs.determine-environment.outputs.environment }}; then
            echo "✅ Environment variables verification passed"
            VERIFICATION_RESULT="success"
          else
            VERIFICATION_EXIT_CODE=$?
            if [ $VERIFICATION_EXIT_CODE -eq 2 ]; then
              echo "🚨 CRITICAL: Essential environment variables missing!"
              echo "Deployment should be rolled back!"
              VERIFICATION_RESULT="critical"
              
              exit 1
            else
              echo "⚠️ Some environment variables have issues but deployment can continue"
              echo "Please review the verification results"
              VERIFICATION_RESULT="warning"
            fi
          fi

      - name: Post-Deploy Lambda Verification
        run: |
          echo "🔍 Comprehensive Lambda verification after CI/CD deployment..."
          sleep 15  # Additional wait after env verification

          # Dynamic function name based on environment
          API_FUNCTION="pro-baseball-api-${{ needs.determine-environment.outputs.environment }}"
          SCRAPING_FUNCTION="pro-baseball-scraping-${{ needs.determine-environment.outputs.environment }}"
          PROCESSING_FUNCTION="pro-baseball-processing-${{ needs.determine-environment.outputs.environment }}"

          # Enhanced API Lambda verification
          echo "📋 Enhanced API Lambda function testing:"
          echo "  Testing health endpoint..."
          if aws lambda invoke --function-name "$API_FUNCTION" --payload '{}' /tmp/api-test-cicd.json; then
            echo "  ✅ API Lambda invocation successful"
            if grep -q "Runtime.ImportModuleError" /tmp/api-test-cicd.json; then
              echo "  ❌ CRITICAL: scraping-history-service import error detected!"
              cat /tmp/api-test-cicd.json
              exit 1
            elif grep -q "Hello from Pro Baseball API" /tmp/api-test-cicd.json; then
              echo "  ✅ API Lambda responding correctly"
            else
              echo "  ⚠️ Unexpected API response:"
              cat /tmp/api-test-cicd.json
            fi
          else
            echo "  ❌ API Lambda invocation failed"
            exit 1
          fi

          echo "📋 Testing scraping history endpoint specifically:"
          HISTORY_PAYLOAD='{"path":"scraping/history","queryStringParameters":{"environment":"${{ needs.determine-environment.outputs.environment }}","limit":"1"}}'
          if aws lambda invoke --function-name "$API_FUNCTION" --payload "$HISTORY_PAYLOAD" /tmp/history-test-cicd.json; then
            echo "  ✅ History endpoint invocation successful"
            if grep -q "Runtime.ImportModuleError\|Cannot find module" /tmp/history-test-cicd.json; then
              echo "  ❌ CRITICAL: History endpoint has module errors!"
              cat /tmp/history-test-cicd.json
              exit 1
            else
              echo "  ✅ History endpoint working correctly"
            fi
          else
            echo "  ❌ History endpoint test failed"
          fi

          echo "📋 Testing other Lambda functions:"
          aws lambda invoke --function-name "$SCRAPING_FUNCTION" --payload '{"year": 2024}' --cli-binary-format raw-in-base64-out /tmp/scraping-test-cicd.json || echo "  ⚠️ Scraping Lambda test failed"
          aws lambda invoke --function-name "$PROCESSING_FUNCTION" --payload '{}' /tmp/processing-test-cicd.json || echo "  ⚠️ Processing Lambda test failed"

          echo "✅ Lambda verification completed"

      - name: Save deployment outputs and update frontend config
        run: |
          cd pro-candidate-aws

          # Install jq if not available
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

          if [ -f cdk-outputs.json ] && [ -s cdk-outputs.json ]; then
            echo "📄 CDK Deployment Outputs:"
            cat cdk-outputs.json
            
            # Extract important URLs (using correct output keys)
            API_URL=$(jq -r '.["ProBaseballStack-${{ needs.determine-environment.outputs.environment }}"]["ApiEndpoint"] // "Not found"' cdk-outputs.json)
            FRONTEND_URL=$(jq -r '.["ProBaseballStack-${{ needs.determine-environment.outputs.environment }}"]["FrontendUrl"] // "Not found"' cdk-outputs.json)
            COGNITO_USER_POOL_ID=$(jq -r '.["ProBaseballStack-${{ needs.determine-environment.outputs.environment }}"]["CognitoUserPoolId"] // ""' cdk-outputs.json)
            COGNITO_CLIENT_ID=$(jq -r '.["ProBaseballStack-${{ needs.determine-environment.outputs.environment }}"]["CognitoClientId"] // ""' cdk-outputs.json)
          else
            echo "⚠️ cdk-outputs.json not found or empty, extracting outputs from CloudFormation stack"
            
            # Fallback: Get outputs directly from CloudFormation stack
            STACK_NAME="ProBaseballStack-${{ needs.determine-environment.outputs.environment }}"
            API_URL=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' --output text || echo "Not found")
            FRONTEND_URL=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`FrontendUrl`].OutputValue' --output text || echo "Not found")
            COGNITO_USER_POOL_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`CognitoUserPoolId`].OutputValue' --output text || echo "")
            COGNITO_CLIENT_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`CognitoClientId`].OutputValue' --output text || echo "")
          fi

          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_ENV
          echo "COGNITO_USER_POOL_ID=$COGNITO_USER_POOL_ID" >> $GITHUB_ENV
          echo "COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID" >> $GITHUB_ENV

          echo "📝 Infrastructure deployment outputs:"
          echo "  API URL: $API_URL"
          echo "  Cognito User Pool: $COGNITO_USER_POOL_ID" 
          echo "  Cognito Client: $COGNITO_CLIENT_ID"
          echo "  Frontend URL: $FRONTEND_URL"
          echo ""
          echo "✅ Infrastructure deployment completed!"
          echo "🔔 Frontend deployment will be triggered separately"

      - name: Health Check
        run: |
          echo "🏥 Performing health check..."
          sleep 30  # Wait for deployment to stabilize

          if [ "$API_URL" != "Not found" ] && [ "$API_URL" != "null" ]; then
            echo "Testing API endpoint: $API_URL"
            curl -f "$API_URL/health" || echo "⚠️ Health check failed"
          else
            echo "⚠️ API URL not found in outputs"
          fi

      # アーティファクトアップロードを一時的に無効化
      # ストレージクォータ問題が解決するまでコメントアウト
      # - name: Upload deployment artifacts
      #   uses: actions/upload-artifact@v4
      #   if: always()
      #   with:
      #     name: deployment-outputs-${{ needs.determine-environment.outputs.environment }}
      #     path: |
      #       pro-candidate-aws/cdk-outputs.json
      #     if-no-files-found: warn
      #     retention-days: 7
      #     compression-level: 9

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment to ${{ needs.determine-environment.outputs.environment }} completed successfully!"
          echo "🌐 API URL: $API_URL"
          echo "🖥️ Frontend URL: $FRONTEND_URL"

      - name: Comment deployment result on PR
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request' && success()
        with:
          script: |
            const environment = '${{ needs.determine-environment.outputs.environment }}';
            const apiUrl = process.env.API_URL;
            const frontendUrl = process.env.FRONTEND_URL;

            let deploymentSummary = `## 🚀 AWS Deployment Success (${environment})\n\n`;
            deploymentSummary += `✅ CDK deployment completed successfully!\n\n`;

            if (apiUrl && apiUrl !== 'Not found' && apiUrl !== 'null') {
              deploymentSummary += `🌐 **API URL**: ${apiUrl}\n`;
            }
            if (frontendUrl && frontendUrl !== 'Not found' && frontendUrl !== 'null') {
              deploymentSummary += `🖥️ **Frontend URL**: ${frontendUrl}\n`;
            }

            deploymentSummary += `\n📊 **Environment**: ${environment}\n`;
            deploymentSummary += `⏰ **Deployed at**: ${new Date().toISOString()}\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: deploymentSummary
            });

  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [determine-environment, aws-deploy]
    if: failure() && needs.determine-environment.outputs.environment == 'prod'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18.20.4'
          cache: 'npm'

      - name: Install dependencies
        run: cd pro-candidate-aws && npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.determine-environment.outputs.aws-region }}

      - name: Emergency notification
        run: |
          echo "🚨 Production deployment failed! Manual intervention may be required."
          echo "Check CloudWatch logs and AWS console for details."

      # Note: Actual rollback logic would depend on specific requirements
      # This is a placeholder for rollback procedures
