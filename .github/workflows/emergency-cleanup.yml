name: Emergency Artifact Cleanup

on:
  workflow_dispatch:

jobs:
  emergency-cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Emergency cleanup all artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            console.log('🚨 EMERGENCY CLEANUP: Deleting ALL artifacts to resolve quota issue');

            try {
              // すべてのアーティファクトを取得
              const artifacts = await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                {
                  owner,
                  repo,
                  per_page: 100
                }
              );
              
              console.log(`Found ${artifacts.length} artifacts to delete`);
              
              let deletedCount = 0;
              let totalSize = 0;
              let errors = [];
              
              // すべてのアーティファクトを削除
              for (const artifact of artifacts) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: artifact.id
                  });
                  deletedCount++;
                  totalSize += artifact.size_in_bytes;
                  console.log(`✅ Deleted: ${artifact.name} (${(artifact.size_in_bytes / 1024 / 1024).toFixed(2)} MB)`);
                } catch (error) {
                  errors.push(`Failed to delete ${artifact.name}: ${error.message}`);
                }
              }
              
              // 結果サマリー
              console.log('\n📊 CLEANUP RESULTS:');
              console.log(`✅ Successfully deleted: ${deletedCount} artifacts`);
              console.log(`💾 Total space freed: ${(totalSize / 1024 / 1024).toFixed(2)} MB`);
              
              if (errors.length > 0) {
                console.log('\n❌ Errors encountered:');
                errors.forEach(error => console.log(`  - ${error}`));
              }
              
              console.log('\n✨ Emergency cleanup completed!');
              console.log('⏰ Note: Storage quota recalculation may take 6-12 hours');
              
            } catch (error) {
              console.error('❌ Emergency cleanup failed:', error);
              throw error;
            }
