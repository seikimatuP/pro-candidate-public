name: Cleanup Old Artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # 毎週日曜日の0時に実行

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Cleanup old artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 7日以上古いアーティファクトを取得
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - 7);

            console.log(`Cleaning artifacts older than ${cutoffDate.toISOString()}`);

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner,
                repo,
                per_page: 100
              }
            );

            let deletedCount = 0;
            let totalSize = 0;

            for (const artifact of artifacts) {
              const createdDate = new Date(artifact.created_at);
              if (createdDate < cutoffDate) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: artifact.id
                  });
                  deletedCount++;
                  totalSize += artifact.size_in_bytes;
                  console.log(`Deleted: ${artifact.name} (${(artifact.size_in_bytes / 1024 / 1024).toFixed(2)} MB)`);
                } catch (error) {
                  console.error(`Failed to delete ${artifact.name}: ${error.message}`);
                }
              }
            }

            console.log(`Summary: Deleted ${deletedCount} artifacts, freed ${(totalSize / 1024 / 1024).toFixed(2)} MB`);
